name: linakan_app
description: LINAKAN - Platform Penghubung Limbah Pangan ke Peternak

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  go_router: ^13.2.4
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  flutter_animate: ^4.5.2
  fl_chart: ^0.68.0
  geolocator: ^12.0.0
  package_info_plus: ^4.0.0
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/intro/
    - assets/images/seller/
    - assets/images/profile/
    - assets/images/logo/
    - assets/logo/
    - assets/videos/
